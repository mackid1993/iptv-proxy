name: ghcr

# Builds this fork's image to ghcr.io/mackid1993/iptv-proxy:latest on every
# push to master (upstream master plus the fixes it carries).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mackid1993/iptv-proxy:latest
            ghcr.io/mackid1993/iptv-proxy:${{ github.sha }}
